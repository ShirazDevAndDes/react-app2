services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react_app
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reactapp.rule=Host(`websitemakerssolutions.com`) || Host(`www.websitemakerssolutions.com`)"
      - "traefik.http.routers.reactapp.entrypoints=websecure"
      - "traefik.http.routers.reactapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.reactapp.loadbalancer.server.port=80"
