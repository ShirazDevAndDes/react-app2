services:
  react-app:
    image: react-initial:latest
    container_name: react-initial-app
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - traefik-net
    labels:
      # Enable Traefik reverse proxy for this service
      - "traefik.enable=true"

      # ==============================================================================
      # DOMAIN NAME CONFIGURATION:
      # Option 1 (Recommended): Set APP_DOMAIN in your .env file or Docker Manager UI.
      # Option 2: Replace `${APP_DOMAIN:-yourdomain.com}` directly below with:
      #           Host(`yourdomain.com`) or Host(`app.yourdomain.com`)
      # ==============================================================================
      - "traefik.http.routers.react-app.rule=Host(`${APP_DOMAIN:-yourdomain.com}`)"

      # HTTPS entrypoint (default for Traefik SSL)
      - "traefik.http.routers.react-app.entrypoints=websecure"
      - "traefik.http.routers.react-app.tls=true"
      - "traefik.http.routers.react-app.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"

      # Internal container port that Nginx is listening on
      - "traefik.http.services.react-app.loadbalancer.server.port=80"

      # Ensure Traefik routes through the shared Docker network
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"

networks:
  traefik-net:
    # Connects to your VPS Traefik network (often named traefik-public, traefik_network, or web)
    name: ${TRAEFIK_NETWORK:-traefik-public}
    external: true
